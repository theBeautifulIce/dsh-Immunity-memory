[package]
name = "memory-core"
version = "0.1.0"
edition = "2021"
description = "Native compute core for dsh-memory-plugin: batch cosine similarity, importance scoring, LSH-style dedupe and conflict detection."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
